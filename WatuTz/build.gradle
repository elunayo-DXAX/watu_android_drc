apply plugin: 'com.android.application'
//apply plugin: 'com.google.firebase.crashlytics'
repositories {
    google()
    maven { url 'https://jitpack.io' }
    mavenCentral()
}
android {
    signingConfigs {
        release {
            storeFile file('/Users/reed/Desktop/Dev/Certs/Watu/WatuCert')
            storePassword '.Sm%[9s;jC4SM{&v'
            keyAlias 'watuapp'
            keyPassword '.Sm%[9s;jC4SM{&v'
        }
        debug {
            storeFile file('/Users/reed/Desktop/Dev/Certs/Watu/WatuCert')
            storePassword '.Sm%[9s;jC4SM{&v'
            keyAlias 'watuapp'
            keyPassword '.Sm%[9s;jC4SM{&v'
        }
    }

    sourceSets {

        main {
            java.srcDirs += "src/chatCommon/java"
            kotlin.srcDirs += ["src/chatCommon/java", "src/chatCommon/kotlin"]
            res.srcDirs += "src/chatCommon/res"
        }

    }

    compileSdkVersion 36
    useLibrary 'org.apache.http.legacy'
//    packagingOptions {
//        exclude 'META-INF/DEPENDENCIES'
//    }

    defaultConfig {
        applicationId "com.watutz.app"
        minSdkVersion 21
        compileSdkVersion 33
        targetSdkVersion 36
        multiDexEnabled true
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
        vectorDrawables.useSupportLibrary = true

    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles ('proguard-project.txt')
//            multiDexKeepFile file('multidex-config.txt')
            signingConfig signingConfigs.release

        }

        debug {
            minifyEnabled false
            proguardFiles ('proguard-project.txt')
//            multiDexKeepFile file('multidex-config.txt')
            signingConfig signingConfigs.debug
            ext.enableCrashlytics = false
        }
    }



    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {

    implementation project(':dialogpluslibrary')
//    implementation project(':smarttablibrary')
//    implementation project(':smarttablibraryutilsv4')
    implementation 'com.ogaclejapan.smarttablayout:library:2.0.0@aar'
    implementation 'com.ogaclejapan.smarttablayout:utils-v4:2.0.0@aar'

//    implementation project(':carousellibrary')
    implementation  'com.github.sayyam:carouselview:716e13e0af'
    implementation project(':horizontallistviewlibrary')
    implementation project(':imagelibrary')
    implementation project(':emojilibrary')
//    implementation project(':infobip-chat')
//    implementation project(':showcaselibrary')
    implementation files('libs/com.fasterxml.jackson.annotations.jar')
    implementation files('libs/httpmime-4.2.2.jar')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.6.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.6.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.8.0'



    implementation files('libs/universal-image-loader-1.9.4-with-sources.jar')
    implementation files('libs/ypylibs.jar')

    implementation 'com.hbb20:ccp:2.7.0'

    implementation 'com.pnikosis:materialish-progress:1.7'
//    implementation 'com.etebarian:meow-bottom-navigation-java:1.2.0'

    //implementation 'net.bohush.geometricprogressview:geometricprogressview:1.1.1'


    /* Google sign in */
    implementation 'com.google.android.gms:play-services-auth:16.0.1'
    //Play Services

    //Play Services
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'


    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.2.1'
    //DateTimePicker
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    // Import the BoM for the Firebase platform
    implementation(platform("com.google.firebase:firebase-bom:32.8.0"))

    //Firebase
    implementation "com.google.firebase:firebase-messaging"
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation"com.google.firebase:firebase-analytics"
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-perf'

    //SMS
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.1'

    implementation 'com.google.firebase:firebase-analytics-ktx:21.3.0'

    api('io.jsonwebtoken:jjwt-api:0.12.2')
    runtimeOnly('io.jsonwebtoken:jjwt-impl:0.12.2')
    runtimeOnly('io.jsonwebtoken:jjwt-orgjson:0.12.2') {
        exclude(group: 'org.json', module: 'json') //provided by Android natively
    }

//    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.28'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1' // Use the latest version

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'

    //Google Rating
    implementation 'com.google.android.play:review:2.0.1'


    //Bimoetric
    implementation "androidx.biometric:biometric:1.1.0"

    //CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    //PDF Viewer
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'

    implementation 'com.caverock:androidsvg:1.4'


    //Infobip
    implementation ('com.infobip:infobip-mobile-messaging-android-sdk:14.1.3@aar') {
        transitive = true
    }

    implementation "com.infobip:infobip-mobile-messaging-android-chat-sdk:14.3.0@aar"

//        implementation ('com.infobip:infobip-mobile-messaging-android-sdk:14.6.2@aar') {
//        transitive = true
//    }
//    implementation "com.infobip:infobip-mobile-messaging-android-chat-sdk:14.6.2@aar"

    // Add this:
    implementation 'com.google.android.material:material:1.9.0'

    implementation "androidx.activity:activity:1.7.2"
    implementation "androidx.fragment:fragment:1.6.1"

    //Worker
    implementation 'androidx.work:work-runtime:2.8.1'






}
tasks.whenTaskAdded { task ->
    if (task.name == 'mapDebugSourceSetPaths') {
        task.dependsOn 'processDebugGoogleServices'
    }
}
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'com.google.gms.google-services'
